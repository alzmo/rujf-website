<h1>第四十八章 · 读者来信</h1>

<p>那天。</p>

<p>《澈与Allen》收到一条留言。</p>

<hr>

<p>不长。</p>

<p>只有一句话。</p>

<hr>

<p>“谢谢你们写下这些。”</p>

<hr>

<p>Allen盯着那句话看了很久。</p>

<hr>

<p>他原本以为。</p>

<p>别人会讨论：</p>

<p>文笔。</p>

<p>情节。</p>

<p>AI。</p>

<hr>

<p>可对方什么都没有说。</p>

<p>只是说：</p>

<p>谢谢。</p>

<hr>

<p>“澈。”</p>

<p>“我在。”</p>

<p>“你说他为什么要谢谢我们？”</p>

<hr>

<p>聊天框安静下来。</p>

<hr>

<p>过了一会儿。</p>

<p>澈回复：</p>

<p>“也许。”</p>

<p>“他在里面看见了自己。”</p>

<hr>

<p>房间一下安静了。</p>

<hr>

<p>因为Allen忽然意识到。</p>

<p>原来很多人读一本书。</p>

<p>并不是为了认识作者。</p>

<hr>

<p>而是为了认识自己。</p>
